<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCI Dashboard</title>
    
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        #loading-message {
            text-align: center;
            position: absolute;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="loading-message">
        <h2>⚡ Initializing SDG EV Dashboard...</h2>
        <p style="color: gray;">Loading Java 17 WebAssembly runtime environments. Please wait a moment.</p>
    </div>

    <script>
        (async () => {
            // FIX: Forces CheerpJ to run in Java 17 mode instead of defaulting to Java 8
            await cheerpjInit({version: 17});
            
            // Hide the placeholder text when the engine takes over
            document.getElementById('loading-message').style.display = 'none';

            // Build the application display canvas
            cheerpjCreateDisplay(1000, 750);
            
            // Automatically detects your repository path seamlessly
            const currentPath = window.location.pathname;
            const formattedPath = currentPath.endsWith('/') ? currentPath : currentPath + '/';
            
            await cheerpjRunMain("InteractiveDashboard3", `/app${formattedPath}InteractiveDashboard3.jar`);
        })();
    </script>

</body>
</html>
